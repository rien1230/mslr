<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>New SCC Code</title>
</head>
<body>

<h1>Create SCC Code</h1>

<form th:action="@{/scc-codes}" th:object="${form}" method="post">
    <div>
        <label>Code</label>
        <div th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
    </div>

    <button type="submit">Create</button>
</form>

<p><a th:href="@{/scc-codes}">Back to list</a></p>

</body>
</html>
